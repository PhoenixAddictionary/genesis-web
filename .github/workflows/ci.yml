name: CI

on:
  push:
  pull_request:

jobs:
  validate-spine:
    name: Validate genesis.event.v1 spine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test deps
        run: pip install pytest
      - name: Run the schema/cross-field validator's own test suite
        run: python -m pytest tests/test_validate_genesis_events.py -v
      - name: Validate spine/spine.jsonl against genesis.event.v1
        run: python tools/validate_genesis_events.py spine/spine.jsonl
      - name: Run the live-tick generator's own test suite
        run: python -m pytest tests/test_generate_live_tick.py -v
      - name: Validate spine/live.jsonl against genesis.live-tick.v1
        run: python tools/generate_live_tick.py --check-file spine/live.jsonl

  validate-packets:
    name: Validate plug-in packets (genesis.packet.v1 / genesis.receipt.v1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test deps
        run: pip install pytest
      - name: Run the packet/receipt validator's own test suite
        run: python -m pytest tests/test_validate_packet.py -v
      - name: Validate every packets/*.json against genesis.packet.v1
        run: |
          shopt -s nullglob
          files=(packets/PKT-*.json)
          if [ ${#files[@]} -gt 0 ]; then python tools/validate_packet.py "${files[@]}"; fi
      - name: Validate every receipts/*.json against genesis.receipt.v1
        run: |
          shopt -s nullglob
          files=(receipts/*.json)
          if [ ${#files[@]} -gt 0 ]; then python tools/validate_packet.py "${files[@]}"; fi
      - name: Validate packets/INDEX.json against the packet files it lists
        run: python tools/validate_packet.py --check-index packets/INDEX.json

  render-plugin-pages:
    name: Rendered plugin/ pages match their markdown source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test deps
        run: pip install pytest
      - name: Run the renderer's own test suite
        run: python -m pytest tests/test_render_markdown_page.py -v
      - name: Fail if the committed HTML is stale relative to PLUG-IN*.md
        run: |
          python tools/render_markdown_page.py
          git diff --exit-code -- plugin/ de/plugin/ hu/plugin/

  browser-checks:
    name: capture.py (browser-verified checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Python deps
        run: pip install requests
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - name: Serve the site, launch Chrome, run capture.py
        # combined into one step: a backgrounded process started in one
        # `run:` block is not reliably still alive by the time a later,
        # separate `run:` block executes (found running this in CI,
        # 2026-09-17 - "Connection refused" on the CDP port even though
        # the launch step itself reported success).
        run: |
          python -m http.server 8017 &
          sleep 1
          "${{ steps.setup-chrome.outputs.chrome-path }}" --headless=new --remote-debugging-port=9222 \
            --user-data-dir=/tmp/chrome-cdp --disable-gpu --hide-scrollbars \
            --no-sandbox --disable-dev-shm-usage \
            --window-size=1440,900 about:blank &
          sleep 2
          python capture.py
