name: CI

on:
  push:
  pull_request:

jobs:
  validate-spine:
    name: Validate genesis.event.v1 spine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test deps
        run: pip install pytest
      - name: Run the schema/cross-field validator's own test suite
        run: python -m pytest tests/test_validate_genesis_events.py -v
      - name: Validate spine/spine.jsonl against genesis.event.v1
        run: python tools/validate_genesis_events.py spine/spine.jsonl

  browser-checks:
    name: capture.py (browser-verified checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Python deps
        run: pip install requests
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - name: Serve the site, launch Chrome, run capture.py
        # combined into one step: a backgrounded process started in one
        # `run:` block is not reliably still alive by the time a later,
        # separate `run:` block executes (found running this in CI,
        # 2026-09-17 - "Connection refused" on the CDP port even though
        # the launch step itself reported success).
        run: |
          python -m http.server 8017 &
          sleep 1
          "${{ steps.setup-chrome.outputs.chrome-path }}" --headless=new --remote-debugging-port=9222 \
            --user-data-dir=/tmp/chrome-cdp --disable-gpu --hide-scrollbars \
            --window-size=1440,900 about:blank &
          sleep 2
          python capture.py
